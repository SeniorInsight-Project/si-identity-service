# Sem segredos aqui: credenciais e endereços vêm de variáveis de ambiente (ver .env.example).
spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:seniorinsight}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # search_path da conexão: JPA, SQL nativo e Flyway enxergam só o schema do serviço.
      schema: identity

  flyway:
    schemas: identity
    default-schema: identity

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  http:
    client:
      # Chamadas ao Keycloak e ao care-service: sem timeout, uma dependência travada prende a requisição.
      connect-timeout: 3s
      read-timeout: 10s

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

server:
  port: ${SERVER_PORT:8080}
  # O serviço fica atrás do API Gateway: respeita X-Forwarded-* (host, proto, prefix) nas URLs geradas.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

identity:
  outbox:
    relay:
      intervalo: PT1S
      tamanho-lote: 100
      timeout-confirmacao: PT5S
  republicacao:
    familiares:
      # Backfill do care-service: ligue uma vez para regravar o user.created de todos os familiares na outbox.
      habilitada: ${IDENTITY_REPUBLICAR_FAMILIARES:false}
      tamanho-lote: ${IDENTITY_REPUBLICAR_FAMILIARES_LOTE:200}
  pareamento:
    # RN-020 diz 24 h; o contrato (openapi/identity-v1.yaml) diz "poucos minutos". Ajustável até o time decidir.
    validade: ${IDENTITY_PAREAMENTO_VALIDADE:PT24H}
    # Depois de vencido ou resgatado, o código ainda responde 410/409 (em vez de 404) por este tempo.
    retencao: ${IDENTITY_PAREAMENTO_RETENCAO:PT24H}
  keycloak:
    # Endereço do Keycloak visto de dentro do serviço (pode diferir do issuer, que é o endereço público).
    url: ${KEYCLOAK_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:seniorinsight}
    client-id: ${KEYCLOAK_CLIENT_ID:si-identity-service}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    dominio-email-idoso: ${KEYCLOAK_DOMINIO_EMAIL_IDOSO:idoso.seniorinsight.invalid}
  care-service:
    url: ${CARE_SERVICE_URL:http://localhost:8081}
    papeis-administrador: ${CARE_SERVICE_PAPEIS_ADMINISTRADOR:ADMINISTRADOR}
